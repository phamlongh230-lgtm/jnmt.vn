openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: JNMT Student Hub API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: messages
    description: Chat message operations
  - name: translate
    description: Translation operations
  - name: announcements
    description: School announcement operations
  - name: ai
    description: AI chat operations
  - name: schools
    description: School directory operations
  - name: tinkercad
    description: Tinkercad class management
  - name: admin
    description: Admin user management

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /healthz/db:
    get:
      operationId: healthCheckDb
      tags: [health]
      summary: Database health check
      responses:
        "200":
          description: Database healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Bad request (validation or duplicate)

  /auth/login:
    post:
      operationId: loginUser
      tags: [auth]
      summary: Login with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized

  /auth/password:
    put:
      operationId: changePassword
      tags: [auth]
      summary: Change password
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordBody"
      responses:
        "200":
          description: Password changed
        "400":
          description: Wrong current password or invalid input
        "401":
          description: Unauthorized

  /auth/profile:
    put:
      operationId: updateProfile
      tags: [auth]
      summary: Update avatar color, avatar URL, or display name
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileBody"
      responses:
        "200":
          description: Updated user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized

  /messages:
    get:
      operationId: getMessages
      tags: [messages]
      summary: Get chat messages (newest last)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        "200":
          description: List of messages with reactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
    post:
      operationId: createMessage
      tags: [messages]
      summary: Send a chat message
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageBody"
      responses:
        "201":
          description: Message created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          description: Unauthorized

  /messages/{id}:
    put:
      operationId: editMessage
      tags: [messages]
      summary: Edit a message (owner only, within 5 minutes)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 2000
              required: [content]
      responses:
        "200":
          description: Updated message
        "403":
          description: Not owner or edit window expired
        "404":
          description: Message not found
    delete:
      operationId: deleteMessage
      tags: [messages]
      summary: Delete a message (owner, mod, or admin)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "403":
          description: Insufficient permissions

  /messages/{id}/reactions:
    post:
      operationId: toggleReaction
      tags: [messages]
      summary: Toggle emoji reaction on a message
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                emoji:
                  type: string
                  minLength: 1
                  maxLength: 10
              required: [emoji]
      responses:
        "200":
          description: Updated reactions map
        "401":
          description: Unauthorized

  /translate:
    post:
      operationId: translateText
      tags: [translate]
      summary: Translate text between supported languages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TranslateBody"
      responses:
        "200":
          description: Translation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TranslateResponse"

  /announcements:
    get:
      operationId: getAnnouncements
      tags: [announcements]
      summary: Get announcements (pinned first)
      responses:
        "200":
          description: List of announcements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Announcement"
    post:
      operationId: createAnnouncement
      tags: [announcements]
      summary: Create announcement (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAnnouncementBody"
      responses:
        "201":
          description: Created announcement
        "403":
          description: Admin only

  /announcements/{id}/pin:
    put:
      operationId: toggleAnnouncementPin
      tags: [announcements]
      summary: Toggle pin status (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated announcement
        "403":
          description: Admin only

  /announcements/{id}:
    delete:
      operationId: deleteAnnouncement
      tags: [announcements]
      summary: Delete announcement (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "403":
          description: Admin only

  /ai/chat:
    post:
      operationId: aiChat
      tags: [ai]
      summary: Chat with AI assistant (Groq llama-3.3-70b)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiChatBody"
      responses:
        "200":
          description: AI response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiChatResponse"
        "503":
          description: AI not configured

  /schools/search:
    get:
      operationId: searchSchools
      tags: [schools]
      summary: Search schools by name or city
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Matching schools (max 8)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/School"

  /schools/{slug}:
    get:
      operationId: getSchool
      tags: [schools]
      summary: Get school by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: School
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/School"
        "404":
          description: Not found

  /tinkercad/my-class:
    get:
      operationId: getMyTinkercadClass
      tags: [tinkercad]
      summary: Get logged-in user's Tinkercad class URL
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Class info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TinkercadClass"
        "404":
          description: Class not assigned

  /tinkercad/classes:
    get:
      operationId: listTinkercadClasses
      tags: [tinkercad]
      summary: List all Tinkercad classes (admin only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All classes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TinkercadClass"
    post:
      operationId: createTinkercadClass
      tags: [tinkercad]
      summary: Create a Tinkercad class (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTinkercadClassBody"
      responses:
        "201":
          description: Created class

  /tinkercad/classes/{id}:
    put:
      operationId: updateTinkercadClass
      tags: [tinkercad]
      summary: Update a Tinkercad class (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTinkercadClassBody"
      responses:
        "200":
          description: Updated class
    delete:
      operationId: deleteTinkercadClass
      tags: [tinkercad]
      summary: Delete a Tinkercad class (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted

  /admin/users:
    get:
      operationId: adminGetUsers
      tags: [admin]
      summary: List all users (admin only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: All users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"

  /admin/users/{id}:
    put:
      operationId: adminUpdateUser
      tags: [admin]
      summary: Update user role, active status, or class group (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminUpdateUserBody"
      responses:
        "200":
          description: Updated user
        "403":
          description: Admin only
        "404":
          description: User not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    RegisterBody:
      type: object
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 30
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
      required: [username, email, password]

    LoginBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    ChangePasswordBody:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 6
      required: [currentPassword, newPassword]

    UpdateProfileBody:
      type: object
      properties:
        avatarColor:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        avatarUrl:
          type: string
          nullable: true
        displayName:
          type: string
          maxLength: 50
          nullable: true

    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [user, moderator, admin]
        avatarColor:
          type: string
        avatarUrl:
          type: string
          nullable: true
        displayName:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, username, email, role]

    AdminUser:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            isActive:
              type: boolean
            classGroup:
              type: string
              nullable: true
            lastLogin:
              type: string
              format: date-time
              nullable: true

    AuthResponse:
      type: object
      properties:
        message:
          type: string
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required: [message, token, user]

    Message:
      type: object
      properties:
        id:
          type: integer
        content:
          type: string
        username:
          type: string
        userId:
          type: integer
        userRole:
          type: string
          nullable: true
        avatarColor:
          type: string
          nullable: true
        isEdited:
          type: boolean
        editedAt:
          type: string
          format: date-time
          nullable: true
        replyToId:
          type: integer
          nullable: true
        replyToContent:
          type: string
          nullable: true
        replyToUsername:
          type: string
          nullable: true
        reactions:
          type: object
          additionalProperties:
            type: object
            properties:
              count:
                type: integer
              userIds:
                type: array
                items:
                  type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, content, username, userId, createdAt]

    CreateMessageBody:
      type: object
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 2000
        replyToId:
          type: integer
          nullable: true
      required: [content]

    TranslateBody:
      type: object
      properties:
        text:
          type: string
        sourceLang:
          type: string
          enum: [vi, ko, en, mn, kk, ru]
        targetLang:
          type: string
          enum: [vi, ko, en, mn, kk, ru]
      required: [text, sourceLang, targetLang]

    TranslateResponse:
      type: object
      properties:
        originalText:
          type: string
        translatedText:
          type: string
        sourceLang:
          type: string
        targetLang:
          type: string
      required: [originalText, translatedText, sourceLang, targetLang]

    Announcement:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        content:
          type: string
        isPinned:
          type: boolean
        authorId:
          type: integer
        authorUsername:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, title, content, isPinned, authorId, authorUsername, createdAt]

    CreateAnnouncementBody:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          minLength: 1
          maxLength: 5000
      required: [title, content]

    AiChatBody:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 1000
        history:
          type: array
          maxItems: 10
          items:
            type: object
            properties:
              role:
                type: string
                enum: [user, assistant]
              content:
                type: string
            required: [role, content]
      required: [message]

    AiChatResponse:
      type: object
      properties:
        reply:
          type: string
      required: [reply]

    School:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        nameKo:
          type: string
          nullable: true
        nameEn:
          type: string
          nullable: true
        slug:
          type: string
        link:
          type: string
          nullable: true
        type:
          type: string
          enum: [high_school, university, language_school]
        city:
          type: string
          nullable: true
        country:
          type: string
        description:
          type: string
          nullable: true
      required: [id, name, slug, type, country]

    TinkercadClass:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        classCode:
          type: string
        tinkercadUrl:
          type: string
        createdAt:
          type: string
          format: date-time
      required: [id, name, classCode, tinkercadUrl]

    CreateTinkercadClassBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        classCode:
          type: string
          minLength: 1
        tinkercadUrl:
          type: string
          format: uri
      required: [name, classCode, tinkercadUrl]

    UpdateTinkercadClassBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        tinkercadUrl:
          type: string
          format: uri

    AdminUpdateUserBody:
      type: object
      properties:
        role:
          type: string
          enum: [user, moderator, admin]
        isActive:
          type: boolean
        classGroup:
          type: string
          nullable: true
