services:
  - type: web
    name: jnmt-student
    runtime: node
    buildCommand: bash render-build.sh
    startCommand: NODE_ENV=production node artifacts/api-server/dist/index.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        generateValue: false
        value: "10000"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: jnmt-db
          property: connectionString

databases:
  - name: jnmt-db
    databaseName: jnmt_db
    user: jnmt_user
    plan: free
